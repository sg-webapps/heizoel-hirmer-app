<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heizöl Hirmer – JSONP Stufentest</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 14px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    .box {
      max-width: 720px;
      margin: 30px auto;
      background: #fff;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }
    h1 { color: #c40000; margin-top: 0; }
    p { font-size: 18px; line-height: 1.5; }
    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 17px;
      background: #c40000;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      margin-top: 14px;
      cursor: pointer;
    }
    button.secondary { background: #555; }
    #status {
      margin-top: 22px;
      padding: 16px;
      background: #eee;
      border-radius: 8px;
      white-space: pre-wrap;
      font-size: 17px;
      line-height: 1.45;
    }
    .ok { background: #e7f6e7 !important; color: #126412; }
    .err { background: #fde7e7 !important; color: #9b0000; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Heizöl Hirmer</h1>
    <p>
      Stufentest ohne Login, Session, HMAC oder iframe.
      Es werden bewusst keine Kundendaten übertragen.
    </p>

    <button onclick="runDataTest()">
      1. JSONP-Datenabruf testen
    </button>

    <button class="secondary" onclick="runProtectedTest()">
      2. Geschützten Test aufrufen
    </button>

    <div id="status">
      Noch kein Test durchgeführt.
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbziVUuLFjHZ_fV1ERLMKX9iHhkX_5nF_-FCaXHffsxq9Y3iL6IzpFGCxuyohmYs6gCwwQ/exec";
    const TEST_TOKEN = "TEST-nlupaIv2yaFRQfaElkH3w9G6";

    function jsonp(action, params = {}) {
      return new Promise((resolve, reject) => {
        const callback =
          '__hirmerTest_' +
          Date.now() +
          '_' +
          Math.floor(Math.random() * 100000);

        const script =
          document.createElement('script');

        const timer =
          setTimeout(() => {
            cleanup();
            reject(
              new Error(
                'Zeitüberschreitung nach 12 Sekunden.'
              )
            );
          }, 12000);

        function cleanup() {
          clearTimeout(timer);

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          try {
            delete window[callback];
          } catch (e) {}
        }

        window[callback] = function(data) {
          cleanup();
          resolve(data);
        };

        const query =
          new URLSearchParams({
            api: 'test',
            action: action,
            callback: callback,
            ...params,
            _: Date.now().toString()
          });

        script.src =
          API_URL +
          '?' +
          query.toString();

        script.onerror = function() {
          cleanup();
          reject(
            new Error(
              'Das JSONP-Script konnte nicht geladen werden.'
            )
          );
        };

        document.head.appendChild(script);
      });
    }

    async function runDataTest() {
      setStatus('JSONP-Datenabruf läuft ...');

      try {
        const data =
          await jsonp('dataTest');

        if (!data || data.success !== true) {
          throw new Error(
            data && data.message
              ? data.message
              : 'Unbekannte Antwort.'
          );
        }

        showOk(
          '✓ JSONP-Datenabruf funktioniert\n\n' +
          'Test: ' + (data.test || '') + '\n' +
          'Backend: ' + (data.backendVersion || '') + '\n' +
          'Fahrzeug: ' +
          (
            data.vehicle
              ? (
                  data.vehicle.name +
                  ' | ' +
                  data.vehicle.plate +
                  ' | Bestand ' +
                  Number(data.vehicle.stock || 0)
                    .toLocaleString('de-DE') +
                  ' L'
                )
              : 'keine Fahrzeugdaten'
          )
        );

      } catch (error) {
        showError(
          error.message ||
          String(error)
        );
      }
    }

    async function runProtectedTest() {
      setStatus('Geschützter Test läuft ...');

      try {
        const data =
          await jsonp(
            'protectedTest',
            {
              token: TEST_TOKEN
            }
          );

        if (!data || data.success !== true) {
          throw new Error(
            data && data.message
              ? data.message
              : 'Unbekannte Antwort.'
          );
        }

        showOk(
          '✓ Geschützter JSONP-Test funktioniert\n\n' +
          'Test: ' + (data.test || '') + '\n' +
          'Meldung: ' + (data.message || '')
        );

      } catch (error) {
        showError(
          error.message ||
          String(error)
        );
      }
    }

    function setStatus(message) {
      const el =
        document.getElementById('status');

      el.className = '';
      el.textContent = message;
    }

    function showOk(message) {
      const el =
        document.getElementById('status');

      el.className = 'ok';
      el.textContent = message;
    }

    function showError(message) {
      const el =
        document.getElementById('status');

      el.className = 'err';
      el.textContent =
        '✗ Fehler\n\n' +
        message;
    }
  </script>
</body>
</html>
