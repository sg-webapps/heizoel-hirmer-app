<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Heizöl Hirmer – JSONP-Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .box {
      width: 100%;
      max-width: 650px;
      margin: 40px auto;
      padding: 30px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin-top: 0;
      color: #c40000;
      font-size: 30px;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 18px;
      border: 0;
      border-radius: 8px;
      background: #c40000;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      margin-top: 25px;
      padding: 18px;
      border-radius: 8px;
      background: #eee;
      font-size: 17px;
      line-height: 1.5;
      word-break: break-word;
    }

    .success {
      background: #e7f6e7 !important;
      color: #126412;
    }

    .error {
      background: #fde7e7 !important;
      color: #9b0000;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Heizöl Hirmer</h1>

    <p>
      JSONP-Verbindungstest zwischen GitHub Pages
      und Google Apps Script.
    </p>

    <button id="testButton" onclick="testConnection()">
      Verbindung testen
    </button>

    <div id="status">
      Noch kein Test durchgeführt.
    </div>

  </div>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbziVUuLFjHZ_fV1ERLMKX9iHhkX_5nF_-FCaXHffsxq9Y3iL6IzpFGCxuyohmYs6gCwwQ/exec';

    function testConnection() {
      const button = document.getElementById('testButton');
      const status = document.getElementById('status');

      button.disabled = true;
      status.className = '';
      status.textContent = 'Verbindung wird getestet ...';

      const callbackName =
        '__hirmerJsonp_' +
        Date.now() +
        '_' +
        Math.floor(Math.random() * 100000);

      const timeout = setTimeout(function() {
        cleanup();
        showError(
          'Zeitüberschreitung: Apps Script hat keine JSONP-Antwort geliefert.'
        );
      }, 12000);

      function cleanup() {
        clearTimeout(timeout);

        if (script && script.parentNode) {
          script.parentNode.removeChild(script);
        }

        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }

        button.disabled = false;
      }

      function showError(message) {
        status.className = 'error';
        status.innerHTML =
          '<strong>✗ Verbindung fehlgeschlagen</strong><br><br><pre>' +
          escapeHtml(message) +
          '</pre>';
      }

      window[callbackName] = function(data) {
        cleanup();

        if (!data || data.success !== true) {
          showError(
            data && data.message
              ? data.message
              : 'Unbekannte Antwort vom Backend.'
          );
          return;
        }

        status.className = 'success';
        status.innerHTML =
          '<strong>✓ JSONP-Verbindung funktioniert!</strong>' +
          '<br><br>' +
          'Meldung: ' + escapeHtml(data.message || '') +
          '<br>' +
          'Backend: ' + escapeHtml(data.backend || '') +
          '<br>' +
          'Test: ' + escapeHtml(data.test || '') +
          '<br>' +
          'Zeitstempel: ' + escapeHtml(data.timestamp || '');
      };

      const script = document.createElement('script');

      script.onerror = function() {
        cleanup();
        showError(
          'Das JSONP-Script konnte nicht geladen werden.'
        );
      };

      script.src =
        API_URL +
        '?action=connectionTest' +
        '&callback=' +
        encodeURIComponent(callbackName) +
        '&_=' +
        Date.now();

      document.head.appendChild(script);
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>

</body>
</html>
